name = "iris"
defaultTargets = ["Iris"]
testDriver = "IrisTest"
enableArtifactCache = true

[[require]]
name = "Qq"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "lean_vir"
git = "https://github.com/ejgallego/lean-vir.git"
rev = "ea9ba047aef4bc6cbb24c24d74a51af50dcce66c"

[[lean_lib]]
name = "Iris"

[[lean_lib]]
name = "IrisTest"
globs = ["IrisTest.+"]

[[lean_exe]]
name = "dumpPortingData"
srcDir = "../scripts"
root = "DumpPortingData"
supportInterpreter = true

[[lean_exe]]
name = "check-imports"
srcDir = "../scripts"
root = "CheckImports"
