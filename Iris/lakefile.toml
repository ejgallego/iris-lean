name = "iris"
defaultTargets = ["Iris"]
testDriver = "IrisTest"
enableArtifactCache = true

[[require]]
name = "Qq"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "lean_vir"
git = "https://github.com/ejgallego/lean-vir.git"
rev = "8032fd34add0b75d4f59c82382e2a57b4c2522a4"

[[lean_lib]]
name = "Iris"

[[lean_lib]]
name = "IrisTest"
globs = ["IrisTest.+"]

[[lean_exe]]
name = "dumpPortingData"
srcDir = "../scripts"
root = "DumpPortingData"
supportInterpreter = true

[[lean_exe]]
name = "check-imports"
srcDir = "../scripts"
root = "CheckImports"
