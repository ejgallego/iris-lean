name = "iris"
defaultTargets = ["Iris"]
testDriver = "IrisTest"
builtinLint = true
enableArtifactCache = true

[[require]]
name = "Qq"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.35.0"

# The meta code of `local stepindex` (kept free of Iris dependencies). Not precompiled: that would
# need a C toolchain with Lean's headers in every build (e.g. the radar benchmark's wrapper has none).
[[lean_lib]]
name = "IrisStepIndex"
roots = ["IrisStepIndex.Registry", "IrisStepIndex.Elab"]

[[require]]
name = "lean_vir"
git = "https://github.com/ejgallego/lean-vir.git"
rev = "ea9ba047aef4bc6cbb24c24d74a51af50dcce66c"

[[lean_lib]]
name = "Iris"
precompileLibrary = true

[[lean_lib]]
name = "IrisTest"
globs = ["IrisTest.+"]

[[lean_exe]]
name = "dumpPortingData"
srcDir = "../scripts"
root = "DumpPortingData"
supportInterpreter = true

[[lean_exe]]
name = "check-imports"
srcDir = "../scripts"
root = "CheckImports"

[leanOptions]
# Built-in linters
linter.missingDocs = false
linter.omit = false
linter.redundantVisibility = true
linter.loopingSimpArgs = false
linter.extra.unreachableTactic = true
linter.extra.unnecessarySeqFocus = true
linter.extra.unusedDecidableInType = false
# Implemented in Iris.Std.Linter.DocPrime
weak.linter.iris.docPrime = false
# Implemented in Iris.Std.Linter.Style
weak.linter.iris.style.setOption = false
weak.linter.iris.style.missingEnd = true
weak.linter.iris.style.cdot = true
weak.linter.iris.style.dollarSyntax = true
weak.linter.iris.style.lambdaSyntax = true
weak.linter.iris.style.longLine = false
weak.linter.iris.style.nameCheck = true
weak.linter.iris.style.openClassical = true
weak.linter.iris.style.show = true
# Implemented in Iris.Std.Linter.DupNamespace
weak.linter.iris.dupNamespace = true
# Implemented in Iris.Std.Linter.Whitespace
weak.linter.iris.style.whitespace = true
